<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111316">
  <title>Music Radar</title>
  <link rel="stylesheet" href="assets/css/music.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="title">Music Radar</h1>
      <p id="subtitle">Latest 24-hour future chill, garage, chillstep, ambient electronic</p>
    </div>
    <div class="status">
      <span id="updated">Loading</span>
      <a id="youtube-search" href="https://somafm.com/" target="_blank" rel="noopener">Source</a>
    </div>
  </header>

  <main class="layout">
    <section class="player-shell" aria-label="Selected track">
      <div class="now-playing">
        <img id="player-art" alt="">
        <div>
          <p>Background audio</p>
          <h2 id="player-title">Select a track</h2>
          <span id="player-subtitle">Ready</span>
        </div>
      </div>
      <audio id="player" controls preload="none"></audio>
      <div id="empty-player" class="empty-player">Select a track</div>
    </section>

    <section class="controls" aria-label="Music controls">
      <nav id="tabs" class="tabs" aria-label="Categories"></nav>
      <label class="search">
        <span>Search</span>
        <input id="filter" type="search" autocomplete="off">
      </label>
    </section>

    <section id="tracks" class="tracks" aria-label="Tracks"></section>
  </main>

  <script src="assets/js/music.js?v=2"></script>
</body>
</html>
